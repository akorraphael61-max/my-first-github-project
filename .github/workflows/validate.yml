name: Basic validation

on:
  push:
  pull_request:

jobs:
  check-files:
    name: Basic file and accessibility checks
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Run basic repository checks
      run: |
        echo "Checking for required files..."
        if [ ! -f index.html ]; then
          echo "ERROR: index.html not found";
          exit 1;
        fi
        if [ ! -f css/style.css ]; then
          echo "ERROR: css/style.css not found";
          exit 1;
        fi
        echo "Checking viewport meta in index.html..."
        if ! grep -qi '<meta name="viewport"' index.html; then
          echo "ERROR: viewport meta tag missing from index.html";
          exit 1;
        fi
        echo "Checking contact form placeholder..."
        if grep -q 'formspree.io/f/YOUR_FORM_ID' index.html; then
          echo "NOTE: Contact form still uses placeholder Formspree ID (YOUR_FORM_ID). Replace with your real ID to enable form submissions.";
        fi
        echo "All basic checks passed.";
